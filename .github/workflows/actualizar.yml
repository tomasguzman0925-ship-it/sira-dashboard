name: Actualizar datos

on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Traer los datos nuevos
        id: actualizar
        run: python actualizar.py

      - name: Guardar los cambios
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
            exit 0
          fi
          semaforo=$(python -c "import json; print(json.load(open('data/actualizacion.json', encoding='utf-8'))['semaforo'])")
          git commit -m "Datos del $(TZ=America/Bogota date +%F): semáforo del ${semaforo}"
          git pull --rebase
          git push
